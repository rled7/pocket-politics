name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  typescript:
    name: TypeScript — typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4        # pnpm version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Workers bundle (wrangler deploy --dry-run)
        run: pnpm worker:deploy --dry-run --outdir "$RUNNER_TEMP/worker-bundle"

  rust:
    name: Rust — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd apps/api-rust && cargo build --release

  bakeoff:
    name: Bake-off — Rust conforms to the TypeScript reference
    runs-on: ubuntu-latest
    needs: [typescript, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api-rust && cargo build --release
      - name: Start Rust backend + run conformance gate
        run: |
          PORT=8787 ./apps/api-rust/target/release/pp-server &
          sleep 3
          # runs tools/bench/conformance.ts with the workspace-pinned tsx
          BASE=http://localhost:8787 pnpm --filter @pp/bench conformance
